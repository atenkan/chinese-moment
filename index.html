<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243c36;background:#eef3ef;--paper:#fffdf7;--ink:#243c36;--muted:#637970;--line:#dce4db;--accent:#286b57;--soft:#edf3e9;--gold:#a65b25}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--paper);color:var(--ink)}button:hover{background:var(--soft)}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #d69b4a;outline-offset:2px}.app{background:var(--paper);max-width:540px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:11px 17px 8px;gap:10px}.brand{font-size:16px;font-weight:750;letter-spacing:.06em}.seal{color:var(--gold);font-size:12px;letter-spacing:.12em}nav{display:flex;gap:5px;padding:0 15px 8px;border-bottom:1px solid var(--line)}nav button{font-size:12px;border-color:transparent;padding:6px 9px}nav button[aria-pressed=true]{color:var(--accent);background:var(--soft);font-weight:700}.count{margin-left:auto;align-self:center;color:var(--muted);font-size:11px}main{padding:10px 18px 10px;flex:1;min-width:0}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}.badge{color:var(--gold)}h1{font-size:clamp(29px,9vw,35px);font-weight:650;margin:9px 0 1px;line-height:1.25;overflow-wrap:anywhere}.pinyin{color:var(--accent);font-size:15px;margin:0 0 4px}.meaning{font-size:13px;margin:0 0 9px;color:var(--muted)}.example{border-left:3px solid #cc9153;padding:1px 0 1px 11px}.han{font-size:18px;line-height:1.45;margin:0 0 4px}.reading{font-size:12px;color:var(--accent);line-height:1.5;margin:0}.translation{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}details{margin:8px 0 0;font-size:12px;line-height:1.6}summary{cursor:pointer;color:var(--accent);font-weight:600}details p{margin:7px 0}.label{color:var(--gold);font-weight:650}.pattern{padding:8px 10px;background:var(--soft);border-radius:8px}footer{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}.primary{background:var(--accent);color:#fff;border-color:var(--accent);flex:1}.primary:hover{background:#205743}.quiet{font-size:12px}.filters{display:flex;gap:7px;margin:0 0 12px}select,input{min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink);font-size:12px}select{max-width:45%}input{width:100%}.row{width:100%;display:flex;text-align:left;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;padding:10px}.row strong{font-size:18px;font-weight:550}.row small{font-size:11px;color:var(--muted)}.row .sub{display:block;font-size:11px;color:var(--accent);margin-top:2px}.empty{color:var(--muted);font-size:13px;line-height:1.6}.status{font-size:11px;color:var(--gold);padding:0 17px 8px}.settings{font-size:13px;line-height:1.6}.settings label{display:block;margin:14px 0}.settings input{width:auto}.settings button{margin:5px 3px 5px 0}.settings h2{font-size:20px}.settings select{max-width:none}.hidden,[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--paper:#182923;--ink:#e5ede6;--muted:#a5b8ae;--line:#35473e;--accent:#79c4a6;--soft:#263c31;--gold:#e5b174;color:var(--ink);background:#122019}.primary{color:#142820}.primary:hover{background:#a0d9bb}}@media(min-width:600px){.app{margin:24px auto;min-height:480px;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #243c3612}}@media(max-width:300px){header{padding:10px}.brand{font-size:14px}.seal{display:none}nav{padding-left:7px;padding-right:7px;gap:0}nav button{padding:5px}main{padding:12px}footer{padding:8px}.count{font-size:10px}}
.family-word{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}.family-word strong{font-size:20px;min-width:72px;font-weight:550}.family-word .translation{display:block;margin:0;font-size:11px}.family-word .reading{font-size:12px}.character-head{display:flex;align-items:center;gap:15px;margin:5px 0 8px}.character-head h1{font-size:45px;margin:0}.character-head .meaning{margin:0}.family{padding:7px 0}.family summary span{font-size:22px;margin-right:6px}nav{gap:1px;padding-left:10px;padding-right:10px}nav button{padding:6px 6px;font-size:11px}.count{font-size:10px}@media(max-width:340px){.count{display:none}}

</style></head><body><div class="app"><header><span class="brand" lang="zh-Hans">一刻中文</span><span class="seal">V3 · CHARACTER WORDS</span></header><nav aria-label="Views"><button data-view="tip" aria-pressed="true">Tip</button><button data-view="vocabulary" aria-pressed="false">Vocabulary</button><button data-view="characters" aria-pressed="false">Characters</button><button data-view="history" aria-pressed="false">History</button><button data-view="settings" aria-pressed="false" aria-label="Settings">⚙</button><span class="count" id="count"></span></nav><main id="main"></main><div id="status" class="status" role="status" aria-live="polite"></div><footer id="footer"><button id="again" class="quiet" title="Bring this tip back in ten minutes">Review soon</button><button id="next" class="primary">Next tip →</button></footer></div>
<script>
'use strict';
const TIPS=[{"topic": "Daily life", "word": "顺便", "pinyin": "shùnbiàn", "meaning": "while you're at it; on the way", "breakdown": "顺 = along / smoothly; 便 = convenient → conveniently along the way.", "memory": "Picture grabbing a coffee as you glide past the café on your usual route.", "example": "我去超市，顺便买点水果。", "reading": "Wǒ qù chāoshì, shùnbiàn mǎi diǎn shuǐguǒ.", "translation": "I'm going to the supermarket and will get some fruit while I'm there.", "pattern": "顺便 + verb: 顺便买点水果", "id": 0}, {"topic": "Daily life", "word": "方便", "pinyin": "fāngbiàn", "meaning": "convenient; suitable", "breakdown": "方 = way / direction; 便 = convenient. Learn 方便 as a whole word.", "memory": "Imagine a door opening exactly where you need it: convenient!", "example": "你现在方便吗？", "reading": "Nǐ xiànzài fāngbiàn ma?", "translation": "Is now a good time for you?", "pattern": "时间 + 方便吗？: 明天方便吗？", "id": 1}, {"topic": "Daily life", "word": "打算", "pinyin": "dǎsuàn", "meaning": "to plan; intend", "breakdown": "打 = hit / do; 算 = calculate. Here they form the verb “plan.”", "memory": "Lay out tomorrow like beads on an abacus: you're calculating your plan.", "example": "你周末打算做什么？", "reading": "Nǐ zhōumò dǎsuàn zuò shénme?", "translation": "What are you planning to do this weekend?", "pattern": "打算 + verb: 打算去公园", "id": 2}, {"topic": "Daily life", "word": "已经", "pinyin": "yǐjīng", "meaning": "already", "breakdown": "已 = already; 经 = pass through. 已经 marks something that has happened.", "memory": "Picture a task already passing through the finish line.", "example": "我已经吃过饭了。", "reading": "Wǒ yǐjīng chī guo fàn le.", "translation": "I've already eaten.", "pattern": "已经 + verb phrase + 了", "id": 3}, {"topic": "Daily life", "word": "一边…一边…", "pinyin": "yìbiān…yìbiān…", "meaning": "doing two things at once", "breakdown": "一 = one; 边 = side. Two “sides” hold two simultaneous actions.", "memory": "Two hands: one holds dinner, the other turns a book page.", "example": "她一边吃饭，一边看书。", "reading": "Tā yìbiān chī fàn, yìbiān kàn shū.", "translation": "She reads while eating.", "pattern": "一边 + action A，一边 + action B", "id": 4}, {"topic": "Shopping", "word": "便宜", "pinyin": "piányi", "meaning": "inexpensive", "breakdown": "便 is pronounced pián here, not biàn; 宜 = suitable. Learn this price word together.", "memory": "See a tiny price tag fitting perfectly in your wallet.", "example": "这个比那个便宜。", "reading": "Zhège bǐ nàge piányi.", "translation": "This one is cheaper than that one.", "pattern": "A 比 B + adjective", "id": 5}, {"topic": "Shopping", "word": "合适", "pinyin": "héshì", "meaning": "suitable; a good fit", "breakdown": "合 = fit / join; 适 = suitable → a suitable fit.", "memory": "Imagine a shoe clicking perfectly onto your foot.", "example": "这件衣服很合适。", "reading": "Zhè jiàn yīfu hěn héshì.", "translation": "This piece of clothing fits well.", "pattern": "东西 + 很合适; 件 is a measure word for clothing.", "id": 6}, {"topic": "Shopping", "word": "试一下", "pinyin": "shì yíxià", "meaning": "try briefly; give it a try", "breakdown": "试 = try; 一下 = briefly / a little. 一下 softens the request.", "memory": "Dip one toe into the water before jumping in.", "example": "我可以试一下吗？", "reading": "Wǒ kěyǐ shì yíxià ma?", "translation": "May I try it?", "pattern": "可以 + verb + 一下吗？", "id": 7}, {"topic": "Shopping", "word": "现金", "pinyin": "xiànjīn", "meaning": "cash", "breakdown": "现 = present / current; 金 = gold / money → money at hand.", "memory": "Imagine actual coins glittering in your hand.", "example": "可以用现金吗？", "reading": "Kěyǐ yòng xiànjīn ma?", "translation": "Can I pay with cash?", "pattern": "用 + payment method: 用现金", "id": 8}, {"topic": "Shopping", "word": "发票", "pinyin": "fāpiào", "meaning": "invoice; official receipt", "breakdown": "发 = issue / send; 票 = ticket / document → an issued document.", "memory": "A printer spits out the official proof of your purchase.", "example": "请问，可以开发票吗？", "reading": "Qǐngwèn, kěyǐ kāi fāpiào ma?", "translation": "Excuse me, can you issue an invoice?", "pattern": "开发票 = issue an invoice (useful for reimbursement).", "id": 9}, {"topic": "Food", "word": "少放", "pinyin": "shǎo fàng", "meaning": "put in less", "breakdown": "少 = less; 放 = put → add less.", "memory": "Picture a cook shrinking a giant salt spoon into a tiny one.", "example": "请少放一点盐。", "reading": "Qǐng shǎo fàng yìdiǎn yán.", "translation": "Please add a little less salt.", "pattern": "少放一点 + ingredient", "id": 10}, {"topic": "Food", "word": "打包", "pinyin": "dǎbāo", "meaning": "pack up; take away", "breakdown": "打 = do (in this expression); 包 = wrap / package.", "memory": "Wrap the rest of your meal in a neat parcel for later.", "example": "这些可以打包吗？", "reading": "Zhèxiē kěyǐ dǎbāo ma?", "translation": "Can these be packed to take away?", "pattern": "可以打包吗？; 打包带走 = pack to take away.", "id": 11}, {"topic": "Food", "word": "口味", "pinyin": "kǒuwèi", "meaning": "taste; flavor preference", "breakdown": "口 = mouth; 味 = flavor → the flavor your mouth likes.", "memory": "Imagine your mouth holding a tiny flavor menu.", "example": "你喜欢什么口味？", "reading": "Nǐ xǐhuan shénme kǒuwèi?", "translation": "What flavor do you like?", "pattern": "喜欢 + 什么口味？", "id": 12}, {"topic": "Food", "word": "先…再…", "pinyin": "xiān…zài…", "meaning": "first…then…", "breakdown": "先 = first; 再 = then / again → sequence.", "memory": "Two stepping stones: stand on “first,” then hop to “then.”", "example": "我们先点菜，再聊天。", "reading": "Wǒmen xiān diǎn cài, zài liáotiān.", "translation": "Let's order first, then chat.", "pattern": "先 + action A，再 + action B", "id": 13}, {"topic": "Food", "word": "够", "pinyin": "gòu", "meaning": "enough", "breakdown": "够 means sufficient. 一点 means a little; 不够 means not enough.", "memory": "Picture rice reaching the “enough” line on your bowl.", "example": "这些菜够我们吃了。", "reading": "Zhèxiē cài gòu wǒmen chī le.", "translation": "These dishes are enough for us.", "pattern": "够 + person + verb: 够我们吃", "id": 14}, {"topic": "Transport", "word": "换乘", "pinyin": "huànchéng", "meaning": "transfer between services", "breakdown": "换 = change; 乘 = ride → change your ride.", "memory": "Hop from one colored metro line to another at a junction.", "example": "我们在下一站换乘。", "reading": "Wǒmen zài xià yí zhàn huànchéng.", "translation": "We'll transfer at the next station.", "pattern": "在 + station + 换乘", "id": 15}, {"topic": "Transport", "word": "往", "pinyin": "wǎng", "meaning": "toward; in the direction of", "breakdown": "往 expresses direction; 左 = left; 右 = right.", "memory": "Imagine an arrow painted on the pavement pointing the way.", "example": "往左走，地铁站就在前面。", "reading": "Wǎng zuǒ zǒu, dìtiězhàn jiù zài qiánmiàn.", "translation": "Go left; the metro station is just ahead.", "pattern": "往 + direction + verb", "id": 16}, {"topic": "Transport", "word": "来得及", "pinyin": "lái de jí", "meaning": "have enough time; make it in time", "breakdown": "来 = come; 得 = complement link; 及 = reach → reach in time.", "memory": "Slide through the train doors just before they close.", "example": "现在走，还来得及。", "reading": "Xiànzài zǒu, hái lái de jí.", "translation": "If we leave now, we can still make it.", "pattern": "来不及 = not enough time; 来得及吗？", "id": 17}, {"topic": "Transport", "word": "离", "pinyin": "lí", "meaning": "away from; distance from", "breakdown": "离 introduces the reference point for distance. 近 = near; 远 = far.", "memory": "Stretch a measuring tape from home to the station.", "example": "我家离地铁站很近。", "reading": "Wǒ jiā lí dìtiězhàn hěn jìn.", "translation": "My home is close to the metro station.", "pattern": "A 离 B + 很近 / 很远", "id": 18}, {"topic": "Transport", "word": "堵车", "pinyin": "dǔchē", "meaning": "traffic jam; be stuck in traffic", "breakdown": "堵 = block; 车 = vehicle → blocked cars.", "memory": "Picture cars like corks plugging a bottle neck.", "example": "路上堵车，我会晚一点到。", "reading": "Lùshang dǔchē, wǒ huì wǎn yìdiǎn dào.", "translation": "There's traffic; I'll arrive a little late.", "pattern": "路上堵车; 晚一点到 = arrive a little late.", "id": 19}, {"topic": "Social", "word": "有空", "pinyin": "yǒu kòng", "meaning": "have free time", "breakdown": "有 = have; 空 = free space. 空 is kòng when it means spare time.", "memory": "Imagine an empty square in your calendar inviting a friend in.", "example": "你明天有空吗？", "reading": "Nǐ míngtiān yǒu kòng ma?", "translation": "Are you free tomorrow?", "pattern": "person + time + 有空吗？", "id": 20}, {"topic": "Social", "word": "麻烦", "pinyin": "máfan", "meaning": "trouble; to trouble someone", "breakdown": "麻 = hemp; 烦 = vexed. These are character meanings, not a literal translation of the word.", "memory": "Picture a tangled knot; someone helps you untie it.", "example": "麻烦你帮我看一下。", "reading": "Máfan nǐ bāng wǒ kàn yíxià.", "translation": "Could you please take a look for me?", "pattern": "麻烦你 + verb phrase: a polite request.", "id": 21}, {"topic": "Social", "word": "没关系", "pinyin": "méi guānxi", "meaning": "it's okay; no problem", "breakdown": "没 = no; 关系 = relationship / connection. Together: “it's okay.”", "memory": "Imagine brushing away a tiny spilled drop with a smile.", "example": "没关系，下次再来吧。", "reading": "Méi guānxi, xià cì zài lái ba.", "translation": "It's okay, come again next time.", "pattern": "没关系 is a common response to an apology.", "id": 22}, {"topic": "Social", "word": "要不", "pinyin": "yàobù", "meaning": "how about…?; alternatively", "breakdown": "要 = want; 不 = not. As a chunk, 要不 introduces an alternative.", "memory": "Imagine offering a second path when the first is blocked.", "example": "要不我们明天见？", "reading": "Yàobù wǒmen míngtiān jiàn?", "translation": "How about we meet tomorrow?", "pattern": "要不 + suggestion？ (conversational)", "id": 23}, {"topic": "Social", "word": "一起", "pinyin": "yìqǐ", "meaning": "together", "breakdown": "一 = one; 起 = rise. Memory image: rising as one.", "memory": "Two friends stand up at the same moment to leave together.", "example": "我们一起去吃饭吧。", "reading": "Wǒmen yìqǐ qù chī fàn ba.", "translation": "Let's go eat together.", "pattern": "一起 + verb; 吧 softens a suggestion.", "id": 24}, {"topic": "University", "word": "复习", "pinyin": "fùxí", "meaning": "review; revise", "breakdown": "复 = repeat / return; 习 = practice → practice again.", "memory": "Walk back over your notes with a bright highlighter.", "example": "我正在复习明天的考试内容。", "reading": "Wǒ zhèngzài fùxí míngtiān de kǎoshì nèiróng.", "translation": "I'm reviewing the material for tomorrow's exam.", "pattern": "正在 + verb: an action in progress.", "id": 25}, {"topic": "University", "word": "预习", "pinyin": "yùxí", "meaning": "preview a lesson; prepare ahead", "breakdown": "预 = beforehand; 习 = practice → practice in advance.", "memory": "Shine a torch down tomorrow's classroom corridor today.", "example": "上课前，我先预习。", "reading": "Shàng kè qián, wǒ xiān yùxí.", "translation": "Before class, I preview the lesson.", "pattern": "activity + 前 = before; activity + 后 = after.", "id": 26}, {"topic": "University", "word": "选课", "pinyin": "xuǎn kè", "meaning": "choose courses", "breakdown": "选 = choose; 课 = course / lesson.", "memory": "Pick classes like dishes from a university menu.", "example": "你这学期选了什么课？", "reading": "Nǐ zhè xuéqī xuǎn le shénme kè?", "translation": "What courses did you choose this semester?", "pattern": "选了 + 什么课？; 学期 = semester.", "id": 27}, {"topic": "University", "word": "交作业", "pinyin": "jiāo zuòyè", "meaning": "hand in homework", "breakdown": "交 = hand over; 作业 = homework / assignment.", "memory": "Pass your finished pages across an imaginary finish line.", "example": "我们周五要交作业。", "reading": "Wǒmen zhōuwǔ yào jiāo zuòyè.", "translation": "We need to hand in homework on Friday.", "pattern": "time + 要交作业", "id": 28}, {"topic": "University", "word": "请教", "pinyin": "qǐngjiào", "meaning": "ask for guidance", "breakdown": "请 = please / invite; 教 = teach → invite someone to teach you.", "memory": "Offer your question like an open book to a teacher.", "example": "老师，我想请教一个问题。", "reading": "Lǎoshī, wǒ xiǎng qǐngjiào yí ge wènt try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){for(const k of ['pinyin','english'])if(typeof saved[k]==='boolean')state[k]=saved[k];if(['All',...TIPS.map(t=>t.topic)].includes(saved.topic))state.topic=saved.topic;if(Number.isFinite(saved.turn))state.turn=Math.max(0,saved.turn);if(TIPS.some(t=>t.id===saved.last))state.last=saved.last;if(Array.isArray(saved.history))state.history=saved.history.filter(h=>h&&TIPS.some(t=>t.id===h.id)&&Number.isFinite(h.at)).slice(-500);if(saved.records&&typeof saved.records==='object')for(const t of TIPS){const r=saved.records[t.id];if(r&&Number.isFinite(r.due)&&Number.isFinite(r.seen)&&Number.isFinite(r.stage))state.records[t.id]={due:r.due,seen:r.seen,stage:Math.max(0,Math.min(4,Math.floor(r.stage)))};}}}catch(e){storageOK=false}

function choose(){const now=Date.now();let pool=TIPS.filter(t=>state.topic==='All'||t.topic===state.topic);if(pool.length>1)pool=pool.filter(t=>t.id!==state.last);const due=pool.filter(t=>state.records[t.id]?.due<=now).sort((a,b)=>state.records[a.id].due-state.records[b.id].due);const fresh=pool.filter(t=>!state.records[t.id]);let selected;review=false;if(due.length&&(state.turn%4===3||!fresh.length)){selected=due[0];review=true}else if(fresh.length){selected=fresh[Math.floor(Math.random()*fresh.length)]}else{const recent=new Set(state.history.slice(-3).map(h=>h.id));const lessRecent=pool.filter(t=>!recent.has(t.id));const candidates=lessRecent.length?lessRecent:pool;selected=candidates.reduce((a,b)=>(state.records[a.id]?.seen||0)<=(state.records[b.id]?.seen||0)?a:b);review=true}if(showElectricOnLoad){selected=TIPS.find(t=>t.kind==='character'&&t.word==='电');showElectricOnLoad=false;review=false;}current=selected;const old=state.records[current.id];const stage=old?Math.min(4,old.stage+(old.due<=now?1:0)):0;state.records[current.id]={seen:now,stage,due:old&&old.due>now?old.due:now+INTERVALS[stage]*DAY};state.history.push({id:current.id,at:now,review});state.history=state.history.slice(-500);state.last=current.id;state.turn++;save();view='tip';render()}

function renderCharacter(t){$('main').innerHTML=`<div class="meta"><span>Character family</span><span class="badge">${review?'↻ Revisit':'✦ Discover'}</span></div><div class="character-head"><h1 lang="zh-Hans">${esc(t.char||t.word)}</h1><div>${state.pinyin?`<p class="pinyin">${esc(t.pinyin)}</p>`:''}${state.english?`<p class="meaning">${esc(t.meaning)}</p>`:''}</div></div>${familyRows(t)}<details><summary>How the meanings connect</summary><p>${esc(t.note||t.breakdown)}</p><p>Some entries are everyday phrases rather than single dictionary words. A character's meaning or pronunciation can change in different combinations.</p></details>`}
function renderCharacters(){ $('main').innerHTML=`<div class="filters"><input id="character-search" type="search" aria-label="Search character families" placeholder="Try 电, dian, water…"></div><div id="character-list"></div>`;function fill(value=''){const found=CHARACTERS.filter(t=>normalized([t.char,t.pinyin,t.meaning,...t.words.map(w=>w.word+' '+w.pinyin+' '+w.meaning)].join(' ')).includes(normalized(value)));$('character-list').innerHTML=found.length?found.map(t=>`<details class="family"${t.char==='电'?' open':''}><summary><span lang="zh-Hans">${esc(t.char)}</span> ${state.pinyin?esc(t.pinyin):''}${state.english?' · '+esc(t.meaning):''}</summary>${familyRows(t)}<p class="empty">${esc(t.note)}</p></details>`).join(''):'<p class="empty">No matching character families.</p>';} $('character-search').oninput=e=>fill(e.target.value);fill();}

function renderList(){const history=view==='history';$('main').innerHTML=`<div class="filters"><select id="browse-topic" aria-label="Filter vocabulary by topic">${options(browseTopic)}<option${browseTopic==='Character words'?' selected':''}>Character words</option></select><input id="search" type="search" aria-label="Search Chinese, pinyin or English" placeholder="Search words…" value="${esc(query)}"></div><div id="list"></div>`;$('browse-topic').onchange=e=>{browseTopic=e.target.value;fillList(history)};$('search').oninput=e=>{query=e.target.value;fillList(history)};fillList(history)}
function normalized(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function fillList(history){let entries=history?[...state.history].reverse().map(h=>({t:TIPS[h.id],h})):LIBRARY.map(t=>({t}));entries=entries.filter(({t})=>(browseTopic==='All'||browseTopic===t.topic)&&normalized([t.word,t.pinyin,t.meaning,t.topic,t.example].join(' ')).includes(normalized(query)));$('list').innerHTML=entries.length?entries.map(({t,h})=>`<button class="row" data-id="${t.id}"><span><strong lang="zh-Hans">${esc(t.word)}</strong><span class="sub">${state.pinyin?esc(t.pinyin)+' · ':''}${state.english?esc(t.meaning):esc(t.topic)}</span></span><small>${h?esc(new Date(h.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})):esc(t.topic)}<br>${h?(h.review?'Revisit':'Seen'):state.records[t.id]?'Seen':'New'} ↗</small></button>`).join(''):'<p class="empty">No matching tips. Try another topic or search.</p>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=TIPS.find(t=>String(t.id)===b.dataset.id)||LIBRARY.find(t=>String(t.id)===b.dataset.id);review=!!state.records[current.id];view='tip';render()})}
function renderSettings(){ $('main').innerHTML=`<div class="settings"><h2>Your small daily habit</h2><p>HSK 2 → 3 practice, plus useful everyday stretch words. ${LIBRARY.length} vocabulary entries · ${CHARACTERS.length} character families · 35 sentence tips.</p><label>Tip rotation topic <select id="rotation">${options(state.topic)}</select></label><label><input type="checkbox" id="pinyin" ${state.pinyin?'checked':''}> Show pinyin</label><label><input type="checkbox" id="english" ${state.english?'checked':''}> Show English translations</label><p>New tips rotate on each page load. Every fourth visit favors a due review. Review intervals: 1, 3, 7, 14, then 30 days. After all words are seen, older words return to keep the habit going.</p><p>“Review soon” brings a word back after ten minutes. Browsing a word does not change its review schedule. History keeps the last 500 tip displays.</p><p>Character notes explain word pieces; memory pictures are invented aids, not claims about historical origins. Pinyin includes common spoken tone changes for 一 and 不.</p><p>Everything stays in this browser, on this site's address. No account, analytics, external fonts, or API calls.</p><button id="export">Export progress</button><button id="reset">Reset progress</button><div id="reset-check" hidden><p>Clear your history and review schedule?</p><button id="confirm-reset">Yes, clear progress</button><button id="cancel-reset">Keep it</button></div></div>`;for(const k of ['pinyin','english'])$(k).onchange=e=>{state[k]=e.target.checked;save()};$('rotation').onchange=e=>{state.topic=e.target.value;save()};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='chinese-moment-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Progress exported. If downloads are blocked in the widget, open the site in a regular tab.')};$('reset').onclick=()=>{$('reset-check').hidden=false};$('cancel-reset').onclick=()=>{$('reset-check').hidden=true};$('confirm-reset').onclick=()=>{state.records={};state.history=[];state.turn=0;state.last=null;choose()}}
$('next').onclick=choose;$('again').onclick=()=>{const old=state.records[current.id]||{seen:Date.now()};state.records[current.id]={...old,stage:0,due:Date.now()+600000};save();notice('Scheduled to resurface after ten minutes.')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});window.addEventListener('pageshow',e=>{if(e.persisted)choose()});let showElectricOnLoad=!localStorageVersionSeen();choose();
function localStorageVersionSeen(){try{const seen=localStorage.getItem('chinese-moment-v3-seen');localStorage.setItem('chinese-moment-v3-seen','yes');return !!seen}catch(e){return false}}
</script></body></html>
